[project]
name = "guardrails"
version = "0.1.0"
requires-python = ">=3.11,<3.12"  # matches gcr.io/distroless/python3-debian12 (ships 3.11.2)
dependencies = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pyyaml==6.0.3",
    "onnxruntime==1.29.0",
    "tokenizers==0.23.2",
    "numpy==2.4.6",  # presidio-analyzer pins numpy<2.5.0
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.12.0",  # required by fastapi.testclient.TestClient (httpx is deprecated for this)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package dir is "app", not "guardrails" (the project name) — hatchling's
# name-matching auto-detection won't find it without this.
packages = ["app"]

[tool.hatch.metadata]
# Needed for the pinned en-core-web-sm wheel URL dependency above. Safe here:
# this package is never published, so hatchling's publish-hygiene check
# (direct URL deps aren't allowed on PyPI) doesn't apply.
allow-direct-references = true
