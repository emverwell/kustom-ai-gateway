version: "3"

tasks:
  up:
    desc: Provision the cluster, gateway, and mock LLM route (guardrails/observability land in later steps)
    cmds:
      - terraform -chdir=terraform/envs/local init -input=false
      - terraform -chdir=terraform/envs/local apply -auto-approve
      - task: load-mock-llm
      - task: apply-manifests

  down:
    desc: Tear down the local kind cluster
    cmds:
      - terraform -chdir=terraform/envs/local destroy -auto-approve

  build-mock-llm:
    desc: Build the mock LLM image
    cmds:
      - docker build -t mock-llm:dev services/mock-llm

  load-mock-llm:
    desc: Load the mock LLM image into the kind cluster
    deps: [build-mock-llm]
    cmds:
      - kind load docker-image mock-llm:dev --name kustom-ai-gateway

  apply-manifests:
    desc: Apply first-party Kubernetes manifests via Kustomize
    cmds:
      - kubectl --kubeconfig terraform/envs/local/kubeconfig apply -k k8s/overlays/local

  apply-manifests-ollama:
    desc: Apply first-party manifests with the chat route pointed at local Ollama instead of the mock LLM
    cmds:
      - kubectl --kubeconfig terraform/envs/local/kubeconfig apply -k k8s/overlays/local-ollama
